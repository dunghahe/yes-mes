{% extends "base.html" %}

{% block content %}
  <section class="auth-panel" aria-labelledby="page-title">
    <p class="eyebrow">YGC MES</p>
    <h1 id="page-title">Đăng nhập</h1>
    <p class="intro">Dùng tài khoản được quản trị viên cấp để tiếp tục.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/login" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Tên đăng nhập</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Mật khẩu</label>
      <div class="password-field" x-data="{ visible: false }">
        <input id="password" name="password" type="password" x-bind:type="visible ? 'text' : 'password'" autocomplete="current-password" required>
        <button class="secondary-button" type="button" x-on:click="visible = !visible" x-text="visible ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'">Hiện mật khẩu</button>
      </div>
      <label for="totp-code">Mã xác thực (chỉ dành cho Admin đã thiết lập TOTP)</label>
      <input id="totp-code" name="totp_code" inputmode="numeric" autocomplete="one-time-code">
      <button class="primary-button" type="submit">Đăng nhập</button>
    </form>
  </section>
{% endblock %}
