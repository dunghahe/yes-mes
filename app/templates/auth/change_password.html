{% extends "base.html" %}

{% block content %}
  <section class="auth-panel" aria-labelledby="page-title">
    <p class="eyebrow">Xin chào, {{ display_name }}</p>
    <h1 id="page-title">Đổi mật khẩu</h1>
    <p class="intro">Cần đổi mật khẩu để tiếp tục. Sau khi đổi, các phiên đăng nhập cũ sẽ bị thu hồi.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/auth/change-password" class="form-stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="current-password">Mật khẩu hiện tại</label>
      <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
      <label for="new-password">Mật khẩu mới</label>
      <input id="new-password" name="new_password" type="password" autocomplete="new-password" required>
      <label for="confirm-password">Nhập lại mật khẩu mới</label>
      <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
      <button class="primary-button" type="submit">Đổi mật khẩu</button>
    </form>
  </section>
{% endblock %}
