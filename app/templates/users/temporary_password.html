{% extends "base.html" %}

{% block content %}
  <section class="auth-panel" aria-labelledby="page-title">
    <p class="eyebrow">Hiển thị một lần</p>
    <h1 id="page-title">{{ title }}</h1>
    <p class="intro">Tài khoản: <strong>{{ username }}</strong></p>
    <p class="helper-text">{{ message }}</p>
    <div class="secret-panel">
      <code class="temporary-password">{{ temporary_password }}</code>
    </div>
    <p class="helper-text">Không ghi mật khẩu này vào nhật ký. Người dùng sẽ phải đổi ngay sau khi đăng nhập.</p>
    <a class="primary-button button-link" href="/admin/users">Quay lại danh sách tài khoản</a>
  </section>
{% endblock %}
