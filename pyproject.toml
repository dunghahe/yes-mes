[project]
name = "ygc-mes"
version = "0.1.0"
description = "Hệ thống nhập liệu sản lượng, NG và OEE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "bcrypt>=4.2,<6",
    "cryptography>=50.0.2,<51",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "qrcode[pil]>=8,<9",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.0.3,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
